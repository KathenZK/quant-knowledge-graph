name: Curated release verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.22"
      - run: uv sync --frozen --extra test --python 3.12
      - run: uv run ruff check .
      - run: uv run quantgraph verify-public
      - run: uv run quantgraph build-public
      - run: uv run pytest -q
